<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#151515" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <meta name="description" content="TOTA & TAMTAM — أزياء مميزة للنساء والأطفال بأسعار مصرية واضحة، توصيل ودفع عند الاستلام" />
    <title>TOTA & TAMTAM</title>
    <style>
      .boot-loader{position:fixed;inset:0;z-index:9999;display:grid;place-content:center;justify-items:center;background:rgba(247,243,234,.97);color:#151515;opacity:1;visibility:visible;transition:opacity .22s ease,visibility .22s ease;backdrop-filter:blur(10px);direction:rtl;font-family:Arial,sans-serif}.boot-loader.is-hiding{opacity:0;visibility:hidden}.boot-loader-mark{display:flex;align-items:center;justify-content:center;width:5.8rem;height:5.8rem;border:3px solid #151515;background:#dfff00;box-shadow:7px 7px 0 #151515;color:#151515;font-size:2rem;font-weight:800;letter-spacing:-.3rem;animation:store-loader-pulse 1.55s ease-in-out infinite}.boot-loader-mark i{padding-inline:.45rem;color:#6546c8;font-size:1.45rem;font-style:normal}.boot-loader strong{margin-top:1.4rem;color:#151515;font-size:.95rem;font-weight:800;letter-spacing:.13em}.boot-loader strong b{color:#6546c8}.boot-loader p{margin:.42rem 0 0;color:#655f57;font-size:.7rem;font-weight:600}.boot-loader-line{width:8.5rem;height:3px;margin-top:1.25rem;overflow:hidden;background:#d7d1c5}.boot-loader-line span{display:block;width:42%;height:100%;background:#f04472;animation:store-loader-line 1.1s ease-in-out infinite}@keyframes store-loader-pulse{50%{transform:translate(-2px,-2px);box-shadow:9px 9px 0 #151515}}@keyframes store-loader-line{0%{transform:translateX(-115%)}100%{transform:translateX(260%)}}
    </style>
  </head>
  <body>
    <div id="boot-loader" class="boot-loader" role="status" aria-label="جاري تجهيز متجر توتا وتمتام">
      <div class="boot-loader-mark" aria-hidden="true"><span>T</span><i>&</i><span>T</span></div>
      <strong>TOTA <b>&</b> TAMTAM</strong>
      <p>نجهّز لكِ اختياراتك</p>
      <div class="boot-loader-line"><span></span></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
