<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#9d5c35" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <meta name="description" content="TOTA & TAMTAM — ملابس نسائية وأطفال مع توصيل ودفع عند الاستلام" />
    <title>TOTA & TAMTAM</title>
    <style>
      .boot-loader{position:fixed;inset:0;z-index:9999;display:grid;place-content:center;justify-items:center;background:rgba(255,248,251,.96);color:#35251f;opacity:1;visibility:visible;transition:opacity .22s ease,visibility .22s ease;backdrop-filter:blur(10px);direction:rtl;font-family:Arial,sans-serif}.boot-loader.is-hiding{opacity:0;visibility:hidden}.boot-loader-mark{display:flex;align-items:center;justify-content:center;width:5.8rem;height:5.8rem;border:1px solid rgba(157,92,53,.42);border-radius:999px;background:#fff;box-shadow:0 18px 45px rgba(65,35,25,.14);color:#754128;font-size:2rem;font-weight:800;letter-spacing:-.3rem;animation:store-loader-pulse 1.55s ease-in-out infinite}.boot-loader-mark i{padding-inline:.45rem;color:#db4f86;font-size:1.45rem;font-style:normal}.boot-loader strong{margin-top:1.1rem;color:#9d5c35;font-size:.95rem;font-weight:800;letter-spacing:.13em}.boot-loader strong b{color:#db4f86}.boot-loader p{margin:.42rem 0 0;color:#76635c;font-size:.7rem;font-weight:600}.boot-loader-line{width:8.5rem;height:2px;margin-top:1.25rem;overflow:hidden;background:#ecdde4}.boot-loader-line span{display:block;width:42%;height:100%;background:linear-gradient(90deg,#db4f86,#9d5c35);animation:store-loader-line 1.1s ease-in-out infinite}@keyframes store-loader-pulse{50%{transform:scale(1.075);box-shadow:0 24px 55px rgba(65,35,25,.23)}}@keyframes store-loader-line{0%{transform:translateX(-115%)}100%{transform:translateX(260%)}}
    </style>
  </head>
  <body>
    <div id="boot-loader" class="boot-loader" role="status" aria-label="جاري تجهيز متجر توتا وتمتام">
      <div class="boot-loader-mark" aria-hidden="true"><span>T</span><i>&</i><span>T</span></div>
      <strong>TOTA <b>&</b> TAMTAM</strong>
      <p>نجهّز لكِ اختياراتك</p>
      <div class="boot-loader-line"><span></span></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
