services:
  postgres:
    image: postgres:16-alpine
    container_name: tota-tamtam-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: tota_tamtam
      POSTGRES_PASSWORD: tota_tamtam_dev
      POSTGRES_DB: tota_tamtam
    volumes:
      - tota_tamtam_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tota_tamtam -d tota_tamtam"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tota_tamtam_postgres_data:
